name: CI

# H1 质量门禁（project-health v2，见 docs/PLAN/2026-08-31_project-health-improvement-v2.md §H1）
#
# 初版范围（2026-08-31）：
#   - ✅ cargo check / 全量测试 / inline-tests 纪律闸 / clippy -D warnings（阻塞门禁）/ 前端三件套
#   - ✅ fmt --check 门禁（2026-09-02 H5 fmt 基线落地后补装；基线=两遍 cargo fmt --all
#     收敛不动点，647 文件重排，零语义变化证据见归档 goal 报告）
#
# clippy 门禁说明：H2 已完成全库清零（基线 1195w+10e → 0w+0e，2026-08-31，
# 六轮全量验证），自本次起 `-D warnings` 阻塞 CI。新的 clippy 警告必须当场修，
# 禁止用 #[allow] 掩盖（确需 allow 必须带理由注释）。
#
# 平台策略：
#   - check/clippy/冒烟 + 前端在 Linux（快、便宜）；
#   - 全量 workspace 测试在 Windows（本地 21,373/0 基线即 Windows，平台一致保证
#     "全绿"承诺诚实；Linux 全量测试放 extended-tests nightly 长期验证）。
#
# 关键前置：crates/nemesis-web/static/ 被 .gitignore（vite 构建产物），而 nemesisbot
# 编译时经 include_dir! 嵌入它（nemesisbot/src/embedded.rs）——所以任何 cargo 步骤
# 之前必须先建 Vue 前端，否则 include_dir! 展开即失败。
#
# 前端可复现构建：package-lock.json 入库后统一用 npm ci（npm install 策略仅保留在
# 本地构建脚本 build-windows.bat / build-linux.sh）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # PR 连推新提交时取消旧 run；main 上同理省 runner 时长
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust check + inline-tests + clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure（2026-09-29 提速 P2）：红轮也保存编译缓存——否则连续修红
      # 时每轮全量重建（2026-09-29 三连红三烧全量的实证教训）。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Node.js (Vue 前端构建)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 与 daily-release 同一套系统依赖（plugin 相关；主二进制用 rustls 不依赖 OpenSSL）。
      # ubuntu-latest 镜像自带 libasound2-dev 等，缺的这里是超集补齐。
      - name: Install Linux system deps (GTK / webkit2gtk / appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build Vue frontend (include_dir! 前置，见文件头注释)
        shell: bash
        run: |
          cd web
          npm ci
          # 防御性清旧 hashed chunk（emptyOutDir:true 已自清，此行兜底 config 翻转）
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # H5 fmt 基线已落地（2026-09-02），格式偏差在此阻塞；规则见 .rustfmt.toml
      - name: cargo fmt --check（阻塞门禁）
        run: cargo fmt --all --check

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

      # 内联测试防回归闸（四形态禁止；独立测试文件才合法）
      - name: Inline-tests discipline gate
        run: bash scripts/check-inline-tests.sh

      # 路径消毒纪律闸（SAN-05：路径成分派生禁裸 replace(':')，走
      # nemesis_utils::sanitize::sanitize_path_segment 单一真相源）
      - name: Sanitize-discipline gate
        run: bash scripts/check-sanitize-discipline.sh

      # provider 烘焙纪律闸（PB-1：白名单外禁新建 create_provider 装配点，
      # 长生命周期消费者走 default_following wrapper 随热切跟随）
      - name: Provider-bake discipline gate
        run: bash scripts/check-provider-bake.sh

      # H2 已清零（2026-08-31），此步为阻塞门禁；见文件头 clippy 门禁说明
      - name: cargo clippy -D warnings（阻塞门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 跨平台冒烟：核心纯逻辑 crate 在 Linux 也必须绿（全量 Linux 测试在 extended-tests）
      - name: Linux cross-platform smoke tests
        run: cargo test -p nemesis-types -p nemesis-config -p nemesis-bus

      # 架构依赖矩阵门禁（扩展计划 T3/D7：分层规则 R1-R7 违规即红，
      # 防依赖倒流/越层直依赖——纯 cargo metadata 读图，秒级）
      - name: Architecture dependency gate
        run: cargo test -p arch-gate

  coverage:
    name: Line coverage floor (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # 扩展计划 T7a/D6（docs/INFO/2026-09-24_公开基准.md §5）：行覆盖硬地板，
      # 防倒退不追高。基线口径：全 workspace lib（nemesis-config 除外——
      # llvm-cov 独立 target-dir 环境特定失败；test-harness / nemesis-build-config
      # 为测试基建 lib 非产品代码，一并排除），见 docs/INFO/2026-06-27_coverage-baseline.md。
      # Windows 本机 2026-09-25 实测 87.85%。当前种子 84 吸收 Linux/Windows
      # 平台差（Linux 缺 Windows 形态测试）；CI 首跑实测后按「实测-2」上调
      # 固定，此后只升不降——上调须附同口径实测数字，防止「改基线凑门槛」。
      COVERAGE_FLOOR_LINES: "84"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain + llvm-tools (coverage 采集前置)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # cache-on-failure（2026-09-29 提速 P2，同 rust-check job 注释）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # prebuilt 二进制直装（秒级）；cargo install 源码编译每轮白烧 3-5min
      # （2026-09-29 提速 P4）
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Setup Node.js (Vue 前端构建，include_dir! 前置)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps (GTK / webkit2gtk / appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build Vue frontend
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # --fail-under-lines：行覆盖低于地板即红（防倒退）。首次合入时以此
      # CI 平台实测为准校准 env 数字（Windows 本机实测会略高——Windows
      # 形态测试在 Linux 不跑）。
      # ulimit -n：workspace lib 套件（nemesis-web 二三千个 #[tokio::test]
      # 同进程跑）fd 累积峰值超 Linux 默认 soft 1024 → EMFILE 级联假红
      # （Failed building the Runtime: Too many open files）；Windows 无
      # 此概念。提到 65535（远低于 runner hard 上限）。
      - name: Measure coverage and enforce floor
        run: ulimit -n 65535; cargo llvm-cov --workspace --lib --exclude nemesis-config --exclude test-harness --exclude nemesis-build-config --summary-only --fail-under-lines "$COVERAGE_FLOOR_LINES"

      # T7b（扩展计划 D6）：生产/测试行数比——CI 汇总打印，数值随仓库
      # 演进浮动，不设门槛（叙事指标非门禁）。
      - name: Test-to-production line ratio summary
        run: |
          bash scripts/test-ratio.sh --quiet
          cat target/test-ratio.txt

  rust-test:
    name: Rust full workspace tests (Windows)
    # 2026-10-08 pin windows-2022：win25（windows-latest 当前指向）20261004 镜像
    # （10-07 发布滚动铺开）落地后本 job 编译期 runner 六连死失联（挂点恒定
    # 51-55min，与并发/调试信息/增量全部缓解措施无关，看门狗也未能软着陆）——
    # 资源压力解释不了时间恒定性，矛头指向镜像波次自身。该波次 OS build 未变
    # （26100.33438 两版一致），但应用层含 WSL 2.7→3.0 大版本跳跃等系统级变更。
    # win22（20261004.326，10-05 波次）无 WSL 升级且 OS 代际不同（20348），作
    # 单变量对照：绿=坐实 win25 20261004 镜像问题（等上游修复再评估回迁），
    # 红=排除镜像、回头排查 Cargo.lock（wasmtime 家族升级）。
    runs-on: windows-2022
    # 90→120（2026-10-08）：编译三杠杆（JOBS:2 + 无增量）换内存余量，编译变慢，
    # 给冷构建留够预算（120 是 ET 同款 job 的既有额度）。
    timeout-minutes: 120
    env:
      # 2026-10-08 编译期 runner 压死战役：wasmtime 家族升级后 nemesisbot debug
      # 编译把 16GB runner 压死，同签名 "hosted runner lost communication" 六连
      # （挂点恒定 51-55min，与本步 Build nemesisbot bin 及 nextest 的测试目标
      # 编译同源）。首轮双杠杆（profile.dev line-tables-only + JOBS:3）无效后
      # 升级三杠杆：
      #   1. CARGO_BUILD_JOBS=2 —— 峰值并发编译内存再砍 1/3；
      #   2. CARGO_INCREMENTAL=0 —— CI 无增量复用收益，白付 rustc 增量数据结构
      #      的大头内存+磁盘（CI 惯例就是关）；
      #   3. 重编译步全部换 .github/scripts/build-with-watchdog.ps1 包装 —— 每
      #      15s 流式打 free RAM/commit/磁盘曲线到步骤日志，跌破地板树杀软着陆
      #      （退 2）而非 runner 硬死失联：要么绿，要么留下资源曲线数据。
      # 若仍失联，下一档 = CARGO_PROFILE_DEV_DEBUG=0（彻底去 PDB，CI 丢 backtrace
      # file:line，本地 line-tables-only 不受影响）。
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable
        # wasm32-wasip2：nemesis-plugins-wasm 的对抗/e2e/sdk 测试在运行时真
        # 构建示例 wasm 组件做 fixture——无此 target = fixture 构建失败 =
        # 诚实 SKIP = 16 个安全测试在 CI 空转（2026-09-30 插件体系复查）。
        with:
          targets: wasm32-wasip2

      # cache-on-failure（2026-09-29 提速 P2，同 rust-check job 注释）
      # workspaces 收编三个示例插件（嵌套独立 workspace）：fixture 构建产物
      # 落在各自 target/，不收编则每轮冷构建多花 3-6 分钟。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/wasm/translate
            plugins/wasm/activity-log
            plugins/wasm/textstat

      # Defender 实时扫描排除 target 目录（2026-09-29 提速 P4）：编译期海量
      # 临时文件逐个过扫描典型拖慢 5-15%；runner 是一次性机器，无安全顾虑
      - name: Exclude target dir from Defender scan
        shell: powershell
        run: Set-MpPreference -ExclusionPath "${{ github.workspace }}\target"

      # nextest prebuilt 直装（秒级，2026-09-29 提速 P3）
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Setup Node.js (Vue 前端构建)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash              # Windows 下 rm -rf 需要 bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # 【历史事故记录 2026-09-01/09-02 三连崩 → 已恢复全量】cpal 0.15 WASAPI
      # 后端在 GitHub runner 虚拟音频栈上会 native ACCESS_VIOLATION（0xc0000005）
      # 秒杀测试进程：①voice 播放流 → ②voice 设备枚举 → ③web 穿透调用
      # （cmd_devices → nemesis_voice::audio::list_devices，同进程首次枚举正常、
      # 二次挂死）。排查确认全部雷点后已恢复 --workspace 全量，防线改为测试内
      # CI=true 双保险 SKIP 闸（凡触碰 cpal 的测试：voice 8 个 + web 穿透 2 个，
      # 设 NEMESISBOT_VOICE_HW_TESTS=1 可在 CI opt-in）。
      # ⚠️ 新增触碰 cpal/音频设备的测试必须挂同款闸，否则 CI 必崩。
      #
      # nextest（2026-09-29 提速 P3）：① 测试二进制并行执行；② .config/nextest.toml
      # 把真 gateway live 批（commands::gateway::{r9_live_tests,scenario_tests}，
      # 固定端口 8080/49000/18790，原 live_gate() 互斥闸只在单进程内生效）钉进
      # max-threads=1 组保串行。两个行为差异（本地验证实证，勿回退）：
      #   a. nextest 只构建测试二进制、不构建常规 bin 目标——live 批夹具要 spawn
      #      target/debug/nemesisbot.exe，前一步必须先 cargo build -p nemesisbot；
      #   b. nextest ≥0.9.1xx 默认 fail-fast（一处红取消剩余），与本 job 全量
      #      体检语义相反——必须显式 --no-fail-fast。
      # nextest 不跑 doctests（本仓库无实质 doctest 断言，无覆盖损失）。
      - name: Build nemesisbot bin (live 批 spawn 依赖, watchdog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag cibuild -MaxMinutes 60 -BuildCommand "cargo build -p nemesisbot"

      - name: cargo nextest run --workspace (watchdog)
        # nextest 步前半段同样是全量测试目标编译（六连死的同源风险面），
        # 同款看门狗包装；尾部行数放大——失败摘要必须在 tail 里可见。
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag nextest -MaxMinutes 75 -TailOut 200 -TailErr 100 -BuildCommand "cargo nextest run --workspace --no-fail-fast"

  frontend:
    name: Frontend typecheck + vitest + build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 皮肤 vitest 断言读 skins/bot/skin/structure.html 等骨架文件——只显式
      # 拉 skins（不能用 submodules: recursive，会连 docs 私有仓库一起拉，
      # runner 的 GITHUB_TOKEN 无权限 → Repository not found，daily-release
      # 2026-09-27 首跑实证）。⚠️ 本 job 全局 working-directory: web，
      # submodule 命令必须显式回仓库根，否则 pathspec 'skins' 不存在。
      - name: Checkout skins submodule
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth 1 skins

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci，lockfile 入库后可复现)
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
