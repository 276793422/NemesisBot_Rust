name: Daily Nightly Release

# H1 改造（project-health v2 §H1）：发布不再绕过验证。
#
# 触发改为【Extended Tests 成功后】经 workflow_run 链式触发：
#   extended-tests.yml（UTC 1:00 定时 + 手动）── 成功 ──▶ 本工作流
#   extended 失败 = 当天没有 nightly（门禁的设计行为）。
# 手动 workflow_dispatch 保留（首次验证 / 临时补发），同样吃 gate 检查。
#
# gate job 防漂移：仅当被验证的 commit（workflow_run.head_sha）仍等于 main HEAD
# （github.sha）才发布；主分支在验证期间前移则放弃本次，下个 nightly 补上。

on:
  workflow_run:
    workflows: ["Extended Tests"]
    types: [completed]
    branches: [main]
  # 允许手动触发，方便首次验证 / 临时重跑
  workflow_dispatch:

# contents:write = 发 Release / 删 tag；actions:write = upload-artifact@v4 需要
permissions:
  contents: write
  actions: write

# 同一时间只放行一个 nightly 流程（后续排队），避免两个 run 同时 delete/create Release 冲突
concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 0: 门禁——Extended Tests 必须成功，且验证 commit 未漂移
  # ============================================================
  gate:
    name: Quality gate (extended-tests green + commit fresh)
    runs-on: ubuntu-latest
    steps:
      - name: Verify trigger
        run: |
          echo "event        = ${{ github.event_name }}"
          echo "tested head  = ${{ github.event.workflow_run.head_sha }}"
          echo "current HEAD = ${{ github.sha }}"
          # 手动触发直接放行（人工决策）；workflow_run 触发必须 success + 未漂移
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.conclusion }}" = "success" \
              || { echo "Extended Tests 未通过，拒绝发布"; exit 1; }
            test "${{ github.event.workflow_run.head_sha }}" = "${{ github.sha }}" \
              || { echo "验证期间 main 已前移，放弃本次发布（下个 nightly 补上）"; exit 1; }
          fi

  # ============================================================
  # Job 1: 构建（Linux + Windows 并行 matrix）
  # ============================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: gate
    strategy:
      fail-fast: false            # 一个平台挂了不影响另一个
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary: nemesisbot          # Linux 产物无后缀
            archive: nightly-linux.tar.gz
            plugins_archive: nightly-linux-plugins.tar.gz
            signserver_archive: nightly-signserver-linux.tar.gz
            signtools_archive: nightly-sign-tools-linux.tar.gz
          - os: windows-latest
            platform: windows
            binary: nemesisbot.exe      # Windows 产物带 .exe
            archive: nightly-windows.zip
            plugins_archive: nightly-windows-plugins.zip
            signserver_archive: nightly-signserver-windows.zip
            signtools_archive: nightly-sign-tools-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 完整历史，commit id 可用

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js (Vue 前端)
        uses: actions/setup-node@v5
        with:
          node-version: '22'      # Node 20 已于 2026-04 EOL，GitHub Actions 2026-06-16 起默认 Node 24；用 22（Active LTS）
          cache: 'npm'
          # package-lock.json 入库（H1 可复现构建）；npm install 策略仅保留在
          # 本地构建脚本 build-windows.bat / build-linux.sh
          cache-dependency-path: web/package-lock.json

      # plugin-ui.so 在 Linux 上依赖：GTK3 + webkit2gtk(4.1) + libayatana-appindicator + librsvg
      # （plugin-ui/Cargo.toml 的 webkit2gtk="2.0" 对应 libwebkit2gtk-4.1）
      # 主 nemesisbot 二进制不依赖它们（用 rustls，无需 OpenSSL）
      - name: Install Linux plugin deps (GTK / webkit2gtk / appindicator)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      # 顺序关键：Vue 必须先于 cargo build——nemesisbot 编译时经 include_dir!
      # 嵌入 crates/nemesis-web/static/（embedded.rs:17），前端没建好 = 白屏二进制。
      - name: Build Vue frontend
        shell: bash              # 必须 bash：rm -rf 在默认 PowerShell 下会报错（-rf 不是 Remove-Item 参数）
        run: |
          cd web
          # lockfile 入库后用 npm ci（可复现构建）；npm install 策略仅保留在本地构建脚本
          npm ci
          # 防御性清旧 hashed chunk（emptyOutDir:true 已自清，此行兜底 config 翻转，
          # 防 include_dir! 把残留 chunk 重复嵌进二进制）
          rm -rf ../crates/nemesis-web/static/assets
          npm run build
          echo "=== 前端产物 ==="
          ls -la ../crates/nemesis-web/static/

      # CI v4 签名集成（P1.2①）：锚注入——消费版与锁定版构建都吃到这个 env。
      # certs/root_cert.der 是信任根的公开证书（换它 = 换根，git 历史可追溯）。
      # 不注入 → 消费版 warn 态出生即降级 off（接入计划矩阵），锁定构建同步跳过。
      - name: Inject root anchor
        shell: bash
        run: |
          if [ -f certs/root_cert.der ]; then
            ANCHOR=$(sha256sum certs/root_cert.der | cut -d' ' -f1)
            echo "NEMESIS_BUILD_ROOT_ANCHOR=$ANCHOR" >> "$GITHUB_ENV"
            echo "root anchor: $ANCHOR"
          else
            echo "⚠️ certs/root_cert.der 不存在——产物无编译期锚（消费版签名验证降级 off），锁定版构建将跳过"
          fi

      - name: Build nemesisbot (release)
        shell: bash
        run: cargo build --release -p nemesisbot

      # plugin 是可选附件：构建失败不影响主程序发布
      - name: Build plugins (non-fatal)
        shell: bash
        continue-on-error: true
        run: |
          (cd plugins/plugin-ui  && cargo build --release)
          (cd plugins/plugin-onnx && cargo build --release)
          # eval-monitor 是 Windows-only 注入 DLL（注入签名的 SbieCtrl.exe
          # 采集 Sandboxie 事件），只在 Windows 编
          if [ "${{ matrix.platform }}" = "windows" ]; then
            (cd plugins/plugin-eval-monitor && cargo build --release)
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staging/plugins
          # 主二进制（workspace 根 target/release/）
          cp "target/release/${{ matrix.binary }}" staging/
          # plugin-ui / plugin-onnx 是独立 workspace（各自 Cargo.toml 带 [workspace] 声明），
          # 产物在各自 plugins/<name>/target/release/ 下；crate 名连字符→下划线：
          #   plugin-ui   → libplugin_ui.so (Linux) / plugin_ui.dll (Windows)
          #   plugin-onnx → libplugin_onnx.so / plugin_onnx.dll
          #   plugin-eval-monitor → eval_monitor_dll.dll（Windows-only 注入 DLL）
          # 编译失败（non-fatal）则文件不存在，跳过，不影响主程序发布
          cp plugins/plugin-ui/target/release/libplugin_ui.so    staging/plugins/ 2>/dev/null || true
          cp plugins/plugin-ui/target/release/plugin_ui.dll     staging/plugins/ 2>/dev/null || true
          cp plugins/plugin-onnx/target/release/libplugin_onnx.so staging/plugins/ 2>/dev/null || true
          cp plugins/plugin-onnx/target/release/plugin_onnx.dll   staging/plugins/ 2>/dev/null || true
          cp plugins/plugin-eval-monitor/target/release/eval_monitor_dll.dll staging/plugins/ 2>/dev/null || true
          echo "=== staging 内容 ==="
          ls -la staging staging/plugins

      - name: Write version info
        shell: bash
        run: |
          cat > staging/version.txt <<EOF
          NemesisBot Nightly Build
          ========================
          Build Date : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Commit     : ${{ github.sha }}
          Branch     : ${{ github.ref_name }}
          Repository : ${{ github.repository }}
          Workflow   : ${{ github.workflow }}
          Run ID     : ${{ github.run_id }}
          Trigger    : ${{ github.event_name }}
          EOF
          cat staging/version.txt

      # CI v4 签名集成（P1.2②）：锁定版构建——feature verify-enforce-lock 编译期
      # 烧死 enforce 策略（feature 指纹原生跟踪，同 target 先消费后锁定无 stale）。
      # 前置守卫：锚缺失 → 跳过（绝不产出无锚锁定二进制 = 自 brick 包）。
      # 顺序关键：必须在 Stage artifacts 之后——locked build 会覆盖 target/release
      # 里的 nemesisbot，消费版二进制得先拷走。
      - name: Build locked nemesisbot (release, verify-enforce-lock)
        shell: bash
        run: |
          if [ -z "${NEMESIS_BUILD_ROOT_ANCHOR:-}" ]; then
            echo "⚠️ 无信任锚——跳过锁定版构建（不产出无法启动的无锚锁定包）"
            exit 0
          fi
          cargo build --release -p nemesisbot --features verify-enforce-lock
          echo "LOCKED_BUILT=1" >> "$GITHUB_ENV"

      - name: Stage locked artifacts
        shell: bash
        if: env.LOCKED_BUILT == '1'
        run: |
          mkdir -p staging-locked/plugins
          cp "target/release/${{ matrix.binary }}" staging-locked/
          cp staging/plugins/* staging-locked/plugins/ 2>/dev/null || true
          cp staging/version.txt staging-locked/
          echo "Flavor    : enforce-locked" >> staging-locked/version.txt
          echo "=== staging-locked 内容 ==="
          ls -la staging-locked

      # signserver（owner 运维包主体）+ sign-tools（用户验签工具包主体）
      - name: Build sign tools (revoke-server + exe-sign-tool)
        shell: bash
        run: cargo build --release -p revoke-server -p exe-sign-tool

      - name: Stage signserver
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then EXT=.exe; else EXT=; fi
          mkdir -p staging-signserver/certs
          cp "target/release/revoke-server$EXT" staging-signserver/
          # 包定位是 owner 运维包（零私钥）；root_cert.der 缺席 = 信任根未入仓，诚实留空
          cp certs/root_cert.der staging-signserver/certs/ 2>/dev/null \
            || echo "⚠️ certs/root_cert.der 不存在——signserver 包暂不带根证书"
          cp scripts/signing/README-SIGNSERVER.md staging-signserver/
          echo "=== staging-signserver 内容 ==="
          ls -la staging-signserver

      - name: Stage sign-tools
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then EXT=.exe; else EXT=; fi
          mkdir -p staging-signtools
          cp "target/release/exe-sign-tool$EXT" staging-signtools/
          cp scripts/signing/VERIFY.md staging-signtools/
          echo "=== staging-signtools 内容 ==="
          ls -la staging-signtools

      # CI v4 签名集成（P1.2③）：各分发 staging 各签一次——锁定包内不允许出现
      # 未签名的锁定版二进制（接入计划 §2.2）。
      # Secrets 未配置 → ci-sign-artifacts.sh WARN + exit 0（构建绿，fork 零门槛）；
      # Secrets 在但签后自检失败 → 脚本 exit 1（构建红，防止静默发坏链产物）。
      - name: Sign artifacts (v4)
        shell: bash
        env:
          NMB_ISSUING_SK: ${{ secrets.NMB_ISSUING_SK_HEX }}
          NMB_ISSUING_CERT: ${{ secrets.NMB_ISSUING_CERT_HEX }}
        run: |
          bash scripts/ci-sign-artifacts.sh staging
          if [ "${LOCKED_BUILT:-}" = "1" ]; then
            bash scripts/ci-sign-artifacts.sh staging-locked
          fi
          bash scripts/ci-sign-artifacts.sh staging-signserver
          bash scripts/ci-sign-artifacts.sh staging-signtools

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf ${{ matrix.archive }} -C staging .

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        # cd 进 staging 再打包 → zip 内是扁平结构（nemesisbot.exe / plugins/ / version.txt），
        # 和 Linux 的 `tar -C staging .` 解压结构一致
        run: |
          cd staging
          7z a "../${{ matrix.archive }}" '*'

      # 单独的 plugins 包（nightly-*-plugins.*）：包内扁平放编译产物（.dll/.so），
      # 只想要插件二进制的人免下整包。格式随平台：Windows 用 zip（7z），
      # Linux 用 tar.gz——与各自主包格式一致。
      # plugin 编译是 non-fatal——一个都没编出来就跳过打包（空包无意义）；
      # 主包内容不变（plugins/ 子目录仍随主包分发）。
      - name: Package plugins
        shell: bash
        run: |
          if compgen -G "staging/plugins/*" > /dev/null; then
            case "${{ matrix.plugins_archive }}" in
              *.tar.gz) (cd staging/plugins && tar -czf "../../${{ matrix.plugins_archive }}" .) ;;
              *.zip)    (cd staging/plugins && 7z a "../../${{ matrix.plugins_archive }}" './*') ;;
            esac
          else
            echo "无 plugin 产物（编译全失败或被跳过），跳过 plugins 包"
          fi

      # ---- CI v4 签名集成（P1.2⑤）：signserver / sign-tools 每平台包 ----
      - name: Package signserver
        shell: bash
        run: |
          case "${{ matrix.signserver_archive }}" in
            *.tar.gz) tar -czf "${{ matrix.signserver_archive }}" -C staging-signserver . ;;
            *.zip)    (cd staging-signserver && 7z a "../${{ matrix.signserver_archive }}" '*') ;;
          esac

      - name: Package sign-tools
        shell: bash
        run: |
          case "${{ matrix.signtools_archive }}" in
            *.tar.gz) tar -czf "${{ matrix.signtools_archive }}" -C staging-signtools . ;;
            *.zip)    (cd staging-signtools && 7z a "../${{ matrix.signtools_archive }}" '*') ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 7

      - name: Upload plugins artifact
        if: hashFiles(matrix.plugins_archive) != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugins_archive }}
          path: ${{ matrix.plugins_archive }}
          retention-days: 7

      # 锁定 staging 以目录形态上传（不打包）——release job 组装跨平台
      # nightly-locked-full.zip 的原料（windows/ 与 linux/ 子目录）。
      - name: Upload locked staging artifact
        if: env.LOCKED_BUILT == '1'
        uses: actions/upload-artifact@v4
        with:
          name: locked-staging-${{ matrix.platform }}
          path: staging-locked/
          retention-days: 7

      - name: Upload signserver package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.signserver_archive }}
          path: ${{ matrix.signserver_archive }}
          retention-days: 7

      - name: Upload sign-tools package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.signtools_archive }}
          path: ${{ matrix.signtools_archive }}
          retention-days: 7

  # ============================================================
  # Job 1b: Android APK（Rust aarch64 交叉编译 + Gradle 壳打包 + 签名）
  # ============================================================
  # 对齐本地链路（scripts/build-android.bat → test-tools/android-shell/sign.bat）：
  #   Vue 前端嵌入 → cargo ndk --release -p nemesisbot（API 36）→ jniLibs 拷贝
  #   → gradlew assembleRelease → APK（nightly-android.apk）。
  # 签名：nemesisbot-release.jks 不入库（S2）——仓库 Secrets 配齐
  #   ANDROID_KEYSTORE_BASE64（.jks 的 base64）+ ANDROID_STORE_PASSWORD +
  #   ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD 时用正式 keystore（与本地
  #   sign.bat 同源，可覆盖安装）；未配置时 gradle 自动落 debug 签名兜底
  #   （可装可跑，与正式版签名不同源，覆盖安装需先卸载）。
  build-android:
    name: Build (android)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 完整历史，git describe 版本提取可用

      - name: Install Rust toolchain (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # rust-toolchain.toml 把全仓 pin 到 1.95.0（rustup 目录 override 压过
      # 上面 dtolnay 步装的 stable），cargo-ndk 不会代装目标 std——不补这一
      # 步，android 编译必爆 E0463（can't find crate for core）。
      # rustup target add 按 active toolchain 解析（目录 override 优先），
      # std 恰好落进 pin 的 1.95.0。
      - name: Install Android target for pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js (Vue 前端)
        uses: actions/setup-node@v5
        with:
          node-version: '22'      # 与 build job 同版本（Active LTS）
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 顺序关键：Vue 必须先于 cargo build——nemesisbot 编译时经 include_dir!
      # 嵌入 crates/nemesis-web/static/（embedded.rs:17），前端没建好 = 白屏二进制。
      - name: Build Vue frontend
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build
          echo "=== 前端产物 ==="
          ls -la ../crates/nemesis-web/static/

      - name: Locate Android NDK (预装；缺失时 sdkmanager 兜底安装)
        run: |
          if [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            echo "runner 未预装 NDK，sdkmanager 安装..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Build nemesisbot (release, aarch64-linux-android)
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0.1")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          export NEMESISBOT_VERSION="$VERSION"
          export NEMESISBOT_GIT_COMMIT="$GIT_COMMIT"
          # 编译期价目表内嵌：值随构建变化 → 绕开 target 缓存强制 build.rs 重跑
          # （对齐 build-android.bat；下载失败自动快照兜底，见 nemesis-data/build.rs）
          export NEMESIS_PRICES_REFRESH="${GIT_COMMIT}_${RANDOM}${RANDOM}"
          export CARGO_TARGET_DIR=target/target_android
          export CARGO_NDK_PLATFORM=36
          cargo ndk -t arm64-v8a build --release -p nemesisbot
          mkdir -p bin/bin_android/arm64-v8a
          cp target/target_android/aarch64-linux-android/release/nemesisbot \
             bin/bin_android/arm64-v8a/nemesisbot
          ls -la bin/bin_android/arm64-v8a/

      - name: Setup Java 17 (AGP 8.6 要求)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure signing (Secrets 正式 keystore，缺省 debug 兜底)
        shell: bash
        working-directory: test-tools/android-shell
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > nemesisbot-release.jks
            cat > keystore.properties <<EOF
          storeFile=nemesisbot-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "签名模式：正式 keystore（Secrets 注入，与本地 sign.bat 同源）"
            "$JAVA_HOME/bin/keytool" -list -keystore nemesisbot-release.jks \
              -storepass "$STORE_PASSWORD" || true
          else
            echo "⚠️ 未配置 ANDROID_KEYSTORE_BASE64 等 Secrets——APK 用 debug 签名兜底"
            echo "⚠️ （可安装运行，但与正式版签名不同源，覆盖安装需先卸载）"
          fi

      - name: Assemble signed release APK
        shell: bash
        working-directory: test-tools/android-shell
        run: |
          chmod +x gradlew            # git 索引里是 100644，Linux 上无执行位
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ../../bin/bin_android/arm64-v8a/nemesisbot \
             app/src/main/jniLibs/arm64-v8a/libnemesisbot.so
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../bin/bin_android_apk
          cp app/build/outputs/apk/release/app-release.apk \
             ../../bin/bin_android_apk/nemesisbot-arm64-release.apk
          ls -la ../../bin/bin_android_apk/

      - name: Verify APK signature
        shell: bash
        run: |
          APK=bin/bin_android_apk/nemesisbot-arm64-release.apk
          "$JAVA_HOME/bin/jarsigner" -verify "$APK" || echo "WARN jarsigner 验证未通过（见上方输出）"
          sha256sum "$APK"

      - name: Package
        run: cp bin/bin_android_apk/nemesisbot-arm64-release.apk nightly-android.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-android.apk
          path: nightly-android.apk
          retention-days: 7

  # ============================================================
  # Job 2: 发布（等三个平台都构建完，统一发 Release）
  # ============================================================
  release:
    name: Publish nightly release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # locked staging 以目录形态单列下载（下一 step）——平铺会互相覆盖
          # version.txt / signatures.json（两平台同名文件，内容不同）
          pattern: '!locked-staging-*'

      - name: Download locked staging artifacts
        uses: actions/download-artifact@v4
        with:
          path: locked-artifacts
          pattern: 'locked-staging-*'

      - name: Show artifacts
        run: ls -la artifacts

      # CI v4 签名集成（P1.2⑤）：nightly-locked-full.zip——锁定版只出这一个
      # 单一大包（用户拍板：不出每平台 locked 包），锁定用户一站式。
      # 原料缺席（无锚 → 锁定构建被跳过）→ 诚实跳过整包，不产残包。
      - name: Assemble nightly-locked-full.zip
        run: |
          if [ ! -d locked-artifacts/locked-staging-windows ] || [ ! -d locked-artifacts/locked-staging-linux ]; then
            echo "⚠️ 锁定 staging 缺席（无锚跳过锁定构建）——跳过 nightly-locked-full.zip"
            exit 0
          fi
          mkdir -p locked-full/android locked-full/certs
          # windows/ 与 linux/：各平台锁定 staging 原样（已签锁定二进制 + plugins/
          # + version.txt(Flavor: enforce-locked) + signatures.json + certs/）
          cp -r locked-artifacts/locked-staging-windows locked-full/windows
          cp -r locked-artifacts/locked-staging-linux locked-full/linux
          # android/：APK 原样（JKS 平台签名 = Android 的锁定语义，v4 不重复签）
          cp artifacts/nightly-android.apk locked-full/android/
          # signserver / sign-tools：按平台子目录合并（各自 signatures.json 不互踩）
          SS_WIN=$(mktemp -d); SS_LNX=$(mktemp -d); ST_WIN=$(mktemp -d); ST_LNX=$(mktemp -d)
          unzip -q artifacts/nightly-signserver-windows.zip -d "$SS_WIN"
          tar xzf artifacts/nightly-signserver-linux.tar.gz -C "$SS_LNX"
          unzip -q artifacts/nightly-sign-tools-windows.zip -d "$ST_WIN"
          tar xzf artifacts/nightly-sign-tools-linux.tar.gz -C "$ST_LNX"
          cp -r "$SS_WIN" locked-full/signserver/windows
          cp -r "$SS_LNX" locked-full/signserver/linux
          cp -r "$ST_WIN" locked-full/sign-tools/windows
          cp -r "$ST_LNX" locked-full/sign-tools/linux
          cp certs/root_cert.der locked-full/certs/
          # 包级清单：全部文件 sha256 + 信任锚（各子目录自己的 v4 清单保留原位）
          python3 - locked-full <<'PYEOF'
          import hashlib, json, os, sys
          root = sys.argv[1]
          anchor = None
          if os.path.exists('certs/root_cert.der'):
              anchor = hashlib.sha256(open('certs/root_cert.der', 'rb').read()).hexdigest()
          files = []
          for dirpath, _, names in os.walk(root):
              for n in sorted(names):
                  if n == 'signatures.json':
                      continue
                  p = os.path.join(dirpath, n)
                  files.append({
                      'file': os.path.relpath(p, root).replace(os.sep, '/'),
                      'sha256': hashlib.sha256(open(p, 'rb').read()).hexdigest(),
                  })
          json.dump({'schema': 1, 'package': 'nightly-locked-full',
                     'chain_root_fp': anchor, 'files': files},
                    open(os.path.join(root, 'signatures.json'), 'w'), indent=2)
          PYEOF
          (cd locked-full && zip -qr ../nightly-locked-full.zip .)
          echo "=== locked-full 内容 ==="
          find locked-full -maxdepth 2 | sort

      # H1：发布包写 manifest（版本/commit/feature/SHA-256）——下载方可自校验
      - name: Generate manifest + SHA-256 checksums
        run: |
          cd artifacts
          sha256sum nightly-linux.tar.gz nightly-windows.zip nightly-android.apk > SHA256SUMS.txt
          # plugins / signserver / sign-tools / locked-full 包视构建情况可能缺席
          # （non-fatal 或无锚跳过），在才计入校验和
          for f in nightly-linux-plugins.tar.gz nightly-windows-plugins.zip \
                   nightly-signserver-linux.tar.gz nightly-signserver-windows.zip \
                   nightly-sign-tools-linux.tar.gz nightly-sign-tools-windows.zip \
                   nightly-locked-full.zip; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt
          done
          VERSION=$(git describe --tags --always 2>/dev/null || echo "untagged")
          cat > MANIFEST.txt <<EOF
          NemesisBot Nightly Manifest
          ==========================
          Version  : ${VERSION}
          Commit   : ${{ github.sha }}
          Branch   : ${{ github.ref_name }}
          Features : default (full)
          Built by : ${{ github.workflow }} #${{ github.run_number }} (run ${{ github.run_id }})
          Quality  : Extended Tests passed on the same commit
          EOF
          cat MANIFEST.txt SHA256SUMS.txt

      # 删掉旧的 nightly-build Release + Tag，实现"覆盖式"最新链接
      - name: Delete previous nightly release + tag
        run: |
          gh release delete nightly-build --yes || true
          git push origin :refs/tags/nightly-build || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          name: "🌙 Nightly Build (${{ github.ref_name }} #${{ github.run_number }})"
          prerelease: true
          files: |
            artifacts/nightly-linux.tar.gz
            artifacts/nightly-windows.zip
            artifacts/nightly-android.apk
            artifacts/nightly-linux-plugins.tar.gz
            artifacts/nightly-windows-plugins.zip
            artifacts/nightly-signserver-linux.tar.gz
            artifacts/nightly-signserver-windows.zip
            artifacts/nightly-sign-tools-linux.tar.gz
            artifacts/nightly-sign-tools-windows.zip
            artifacts/nightly-locked-full.zip
            artifacts/MANIFEST.txt
            artifacts/SHA256SUMS.txt
          body: |
            ## 📦 Nightly Build

            自动每日编译的开发版本（Windows + Linux + Android）。

            | 项 | 值 |
            |---|---|
            | Commit | `${{ github.sha }}` |
            | Branch | `${{ github.ref_name }}` |
            | Trigger | ${{ github.event_name }} |
            | Run ID | ${{ github.run_id }} |

            ### 下载
            - **Windows**: `nightly-windows.zip`（解压后运行 `nemesisbot.exe gateway`）
            - **Linux**: `nightly-linux.tar.gz`（解压后运行 `./nemesisbot gateway`）
            - **Android**: `nightly-android.apk`（arm64-v8a；签名模式见 build-android job 日志——配置了 ANDROID_KEYSTORE_* Secrets 为正式签名（与本地 sign.bat 同源），未配置为 debug 签名兜底（覆盖安装需先卸载））
            - **Windows 插件包**: `nightly-windows-plugins.zip`（包内扁平放插件 .dll：plugin_ui / plugin_onnx / eval_monitor_dll）
            - **Linux 插件包**: `nightly-linux-plugins.tar.gz`（包内扁平放插件 .so）
            - **锁定版全家桶**: `nightly-locked-full.zip`（签名验证强制（enforce）的锁定版 Windows/Linux 客户端 + Android APK + 全部插件 + signserver + sign-tools 一站式；启动日志/侧栏带 🔒 标识；信任根未配置时本包缺席）
            - **验签工具**: `nightly-sign-tools-windows.zip` / `nightly-sign-tools-linux.tar.gz`（exe-sign-tool + VERIFY.md——下载后逐文件验证包内二进制，零私钥）
            - **签发吊销服务**: `nightly-signserver-windows.zip` / `nightly-signserver-linux.tar.gz`（owner 运维包，零私钥，配合离线 keys.json 运行）

            > 签名说明：配置了 `NMB_ISSUING_*` Secrets 时全部本方二进制带 v4 签名
            > （ECDSA P-256 + X.509 三级链，包内附 `signatures.json` 清单与
            > `certs/root_cert.der` 根证书）；未配置时产物无签名但构建照常（fork 零门槛）。
            > 验签：`exe-sign-tool verify --root-cert certs/root_cert.der --target nemesisbot.exe`。

            > plugins 包视 plugin 编译情况可能缺席（non-fatal）；主包内的 plugins/ 子目录不变。

            > ⚠️ 此为开发版本，可能包含未测试的功能，仅供测试使用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
