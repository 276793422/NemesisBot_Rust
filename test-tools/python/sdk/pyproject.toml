[project]
name = "nemesisbot"
version = "0.1.0"
description = "Python SDK for driving NemesisBot as a subprocess (spawn gateway --local, chat over WebSocket)"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemesisbot*"]
