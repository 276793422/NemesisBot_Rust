[package]
name = "authn-demo"
version = "0.1.0"
edition = "2021"
description = "身份与访问框架 demo CLI：每个验证项一个子命令（本地账号/会话/静态 token/OIDC/LDAP）"
license = "MIT"

[dependencies]
authn-core = { path = "../authn-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
