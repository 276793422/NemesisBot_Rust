<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>NemesisBot</title>
  <script>
    // 皮肤冷启动同步注入（防 FOUC，WorkBuddy applyCachedCssSync 同款）：
    // ?skin= 查询参数临时覆盖（写入缓存），否则用 localStorage 缓存的
    // 激活 id + CSS。异步校准在 main.ts 的 applySkinBoot()。
    // v2 结构皮肤：结构缓存（清洗后 HTML）一并回放为 inert template
    // （不进活 DOM），SkinSlot 首挂时同步消费——皮肤骨架随首帧渲染。
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('skin');
        if (q && q !== 'default') { localStorage.setItem('nemesisbot_skin', q); }
        var id = q || localStorage.getItem('nemesisbot_skin') || '';
        if (id && id !== 'default') {
          document.documentElement.setAttribute('data-skin', id);
          if (!q) {
            var css = localStorage.getItem('nemesisbot_skin_css');
            if (css) {
              var sheet = document.createElement('style');
              sheet.setAttribute('data-skin-sheet', '');
              sheet.textContent = css;
              document.head.appendChild(sheet);
            }
            // 结构缓存只在 id 与 CSS 缓存一致时回放（T3 校准兜底过期内容）
            var struct = localStorage.getItem('nemesisbot_skin_structure');
            if (struct && struct.indexOf('data-nb-slot') >= 0) {
              var t = document.createElement('template');
              t.setAttribute('data-nb-structure-cache', '');
              t.innerHTML = struct;
              document.head.appendChild(t);
            }
          }
        }
      } catch (e) { /* localStorage 不可用（隐私模式等）→ 内置皮肤 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
