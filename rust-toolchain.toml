# Toolchain override for NemesisBot.
#
# Pinned to an exact version (1.95.0) as of 2026-09-01. This file previously
# tracked "stable", but CI (dtolnay/rust-toolchain@stable) floats to the latest
# stable on every run: CI clippy 1.98 shipped lints the 1.95 toolchains on the
# dev machines had never seen (needless_late_init on late-init-in-match-arms),
# producing "green everywhere, red only on CI". This file is the single source
# of truth for the toolchain version everywhere (local / remote device / CI —
# rustup's directory override beats whatever the CI action installed).
#
# To upgrade the toolchain: bump the version here, let rustup fetch it locally,
# fix any new clippy/rustfmt findings, verify, and only then commit. CI always
# follows this file — never the other way round. rustup auto-installs the
# pinned toolchain (per profile/components below) on machines that lack it.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
