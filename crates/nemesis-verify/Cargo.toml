[package]
name = "nemesis-verify"
version.workspace = true
license.workspace = true
edition.workspace = true

# crate-type：lib（供 Rust 依赖）+ cdylib（产 nemesis_verify.dll / libnemesis_verify.so / .dylib，C ABI 导出 nv_*）。
[lib]
name = "nemesis_verify"
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# v4：ECDSA P-256 + SHA-256（RFC 6979 确定式签名）
p256 = { workspace = true }
ecdsa = { workspace = true }
# v4 X.509 证书链（声明式 ASN.1 类型，零手撸 DER）
x509-cert = { workspace = true }
der = { workspace = true }
# v4 CMS SignedData（Authenticode 形态构造，S0-6 选型）
cms = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
# P2a：DLL 联网查 CRL（数据模式，blocking 同步 HTTP + rustls，无 OpenSSL 依赖）
reqwest = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
