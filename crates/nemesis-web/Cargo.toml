[package]
name = "nemesis-web"
version.workspace = true
license.workspace = true
edition.workspace = true

# P2-2 (2026-08-24 UI entry gap): compile-time packaging of the Python SDK
# (test-tools/python/sdk) into the two zips embedded by sdk_embed.rs. Same
# `zip` crate the rest of the workspace already uses (nemesis-utils/skills/
# sandbox/security); deflate-only keeps the build script light.
[build-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
nemesis-types = { workspace = true }
nemesis-bus = { workspace = true }
nemesis-providers = { workspace = true }
nemesis-config = { workspace = true }
nemesis-cluster = { workspace = true, optional = true }
nemesis-forge = { workspace = true, optional = true }
nemesis-skills = { workspace = true }
nemesis-security = { workspace = true, optional = true }
nemesis-sandbox = { workspace = true, optional = true }
nemesis-cron = { workspace = true }
nemesis-services = { workspace = true }
nemesis-voice = { workspace = true, optional = true }
nemesis-memory = { workspace = true, optional = true }
nemesis-data = { workspace = true }
# 目录缓存路径唯一真相源在 nemesis-path（models_catalog_cache_path 等，
# 与 CLI catalog.rs 共用——nemesis-web 不能依赖 binary crate）。
nemesis-path = { workspace = true }
nemesis-agent = { workspace = true }
nemesis-workflow = { workspace = true, optional = true }
nemesis-utils = { workspace = true }
# P2-1 (2026-08-24 UI entry gap): coding.lsp_status probes the language-server
# registry table (SERVERS / server_available). Unconditional, mirroring
# nemesis-agent's own non-optional dependency on nemesis-lsp.
nemesis-lsp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
dashmap = { workspace = true }
http = "1"
url = "2"
async-trait = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[features]
# Optional subsystems (not in default — enabled via feature passthrough from
# the `nemesisbot` binary so a trimmed build can drop them).
voice = ["dep:nemesis-voice"]
cluster = ["dep:nemesis-cluster"]
forge = ["dep:nemesis-forge"]
memory = ["dep:nemesis-memory"]
workflow = ["dep:nemesis-workflow"]
security = ["dep:nemesis-security", "nemesis-security/security"]
sandbox = ["dep:nemesis-sandbox"]

[dev-dependencies]
tempfile = "3"
# S10a 覆盖率（2026-08-26）：workflow 同步 run 超时臂测试用
# #[tokio::test(start_paused = true)] 暂停时钟（test-util 不在 "full" 内，
# 仅测试用，不进生产依赖图）。
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
# Phase 3 覆盖率（2026-08-25）：server setter 全扫测试要构造
# WorkflowEngine::new_integrated 的 ToolRegistry 参数（仅测试用，
# 不进生产依赖图）。
nemesis-tools = { workspace = true }
# Phase 3 覆盖率（2026-08-25）：sse_chat handler 测试用 wiremock 起 SSE 假
# LLM 后端（与 nemesis-providers 同版本），全程进程内无 TCP 端口竞争。
wiremock = "0.6"
# P2-2: sdk_embed tests open the embedded bytes as a real archive (structural
# round-trip — the guarantee that unzip/pip install work, not just non-empty).
zip = { version = "2", default-features = false, features = ["deflate"] }
